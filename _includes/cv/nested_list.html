<!-- _includes/cv/nested_list.html -->
{% for item in entry.contents %}
  <div class="row mt-2 mt-md-0">
    <div class="col-md-12">
      {% if item.title %}
        <span class="font-weight-bold">{{ item.title }}</span>
      {% endif %}
      {% if item.contents %}
        <ul class="mt-1">
          {% for subitem in item.contents %}
            <li>{{ subitem }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>
  </div>
{% endfor %}
