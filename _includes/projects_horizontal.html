<style>
  .proj-card-link { text-decoration: none !important; display: block; }

  .proj-card {
    display: flex;
    flex-direction: row;
    border-radius: 6px;
    overflow: hidden;
    height: 220px;
    background: var(--global-card-bg-color);
    border: 1px solid var(--global-divider-color);
    margin-bottom: 1.5rem;
  }

  .proj-card-img {
    width: 42%;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    background: var(--global-code-bg-color);
  }

  .proj-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* Arcade attract mode — rest state. Vignette (::after) darkens the thumbnail
     edges; the "PRESS START" caption (::before) blinks over it. Both sit above
     the img, below the card text, and never intercept pointer events. On hover
     they fade out ("insert coin"). z-order: caption (z 2) over vignette (z 1). */
  .proj-card-img::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(15,25,28,0.38) 100%);
  }

  /* Decorative caption; the string lives in CSS content (aria-hidden by nature
     — pseudo-element content is not part of the accessibility tree). */
  .proj-card-img::before {
    content: 'PRESS START';
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    z-index: 2;
    pointer-events: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 0.08em;
    color: #FAF9F7;
    text-shadow: 0 1px 0 rgba(0,0,0,0.55);
    white-space: nowrap;
  }

  .proj-card-img-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .proj-card-img-placeholder::after {
    content: '';
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--global-divider-color);
  }

  .proj-card-body {
    flex: 1;
    padding: 1.5rem 1.6rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
  }

  .proj-card-meta {
    margin: 0 0 0.15rem;
  }

  .proj-card-title {
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--global-text-color);
    line-height: 1.25;
    margin: 0;
  }

  .proj-card-desc {
    font-size: 0.85rem;
    color: var(--global-text-color-light);
    line-height: 1.5;
    margin: 0;
  }

  .proj-card-github {
    margin-top: 0.5rem;
    font-size: 1rem;
    color: var(--global-text-color-light);
  }

  /* Always-on: border accent on hover/focus (also the reduced-motion cue). */
  .proj-card-link:hover .proj-card,
  .proj-card-link:focus-visible .proj-card {
    border-color: var(--global-theme-color);
  }

  /* Reduced motion: caption shows static (no blink); vignette + caption still
     fade out on hover (opacity-only is safe). */
  @media (prefers-reduced-motion: reduce) {
    .proj-card-img::after,
    .proj-card-img::before {
      transition: opacity 200ms ease-out;
    }
    .proj-card-link:hover .proj-card-img::after,
    .proj-card-link:focus-visible .proj-card-img::after,
    .proj-card-link:hover .proj-card-img::before,
    .proj-card-link:focus-visible .proj-card-img::before {
      opacity: 0;
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    .proj-card {
      transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 200ms ease-out,
                  box-shadow 320ms ease-out;
    }
    .proj-card-img img {
      transition: transform 600ms ease-out;
    }
    /* Insert coin: vignette + caption fade out on hover. Caption blinks at rest. */
    .proj-card-img::after,
    .proj-card-img::before {
      transition: opacity 200ms ease-out;
    }
    .proj-card-img::before {
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .proj-card-meta {
      transition: letter-spacing 300ms ease-out, color 300ms ease-out;
    }
    .proj-card-title {
      transition: color 300ms ease-out;
    }

    .proj-card-link:hover .proj-card,
    .proj-card-link:focus-visible .proj-card {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }
    .proj-card-link:hover .proj-card-img img,
    .proj-card-link:focus-visible .proj-card-img img {
      transform: scale(1.05);
    }
    .proj-card-link:hover .proj-card-img::after,
    .proj-card-link:focus-visible .proj-card-img::after {
      opacity: 0;
    }
    .proj-card-link:hover .proj-card-img::before,
    .proj-card-link:focus-visible .proj-card-img::before {
      animation: none;
      opacity: 0;
    }
    .proj-card-link:hover .proj-card-meta,
    .proj-card-link:focus-visible .proj-card-meta {
      letter-spacing: 0.14em;
      color: var(--global-theme-color);
    }
    .proj-card-link:hover .proj-card-title,
    .proj-card-link:focus-visible .proj-card-title {
      color: var(--global-theme-color);
    }
    /* Active (click): the stamp. */
    .proj-card-link:active .proj-card {
      transform: scale(0.97) translateY(-2px);
      transition: transform 90ms ease-in;
    }
    html[data-theme='dark'] .proj-card-link:hover .proj-card,
    html[data-theme='dark'] .proj-card-link:focus-visible .proj-card {
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
  }

  @media (max-width: 576px) {
    .proj-card { flex-direction: column; height: auto; }
    .proj-card-img { width: 100%; height: 160px; }
  }
</style>

<div class="card-item col">
  {%- if project.redirect -%}
  <a class="proj-card-link" href="{{ project.redirect }}">
  {%- else -%}
  <a class="proj-card-link" href="{{ project.url | relative_url }}">
  {%- endif -%}
    <div class="proj-card">
      <div class="proj-card-img">
        {%- if project.img -%}
        <img src="{{ project.img | relative_url }}" alt="{{ project.title }}" />
        {%- else -%}
          <div class="proj-card-img-placeholder"></div>
        {%- endif -%}
      </div>
      <div class="proj-card-body">
        {%- if project.meta -%}
        <p class="meta-line proj-card-meta">{{ project.meta }}</p>
        {%- endif -%}
        <h3 class="proj-card-title">{{ project.title }}</h3>
        <p class="proj-card-desc">{{ project.description }}</p>
        {%- if project.github -%}
        <div class="proj-card-github">
          <a href="{{ project.github }}" onclick="event.stopPropagation()">
            <i class="fab fa-github"></i>
          </a>
        </div>
        {%- endif -%}
      </div>
    </div>
  </a>
</div>
