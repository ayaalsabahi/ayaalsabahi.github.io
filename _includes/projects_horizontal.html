<style>
  .proj-card-link { text-decoration: none !important; display: block; }

  .proj-card {
    display: flex;
    flex-direction: row;
    border-radius: 12px;
    overflow: hidden;
    height: 220px;
    background: var(--global-card-bg-color);
    border: 1px solid rgba(255,255,255,0.07);
    transition: transform 0.3s cubic-bezier(.25,.8,.25,1), box-shadow 0.3s cubic-bezier(.25,.8,.25,1);
    margin-bottom: 1.5rem;
  }

  .proj-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }

  .proj-card-img {
    width: 42%;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    background: #1a1a1a;
  }

  .proj-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: transform 0.5s cubic-bezier(.25,.8,.25,1);
  }

  .proj-card:hover .proj-card-img img {
    transform: scale(1.04);
  }

  .proj-card-img-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .proj-card-img-placeholder::after {
    content: '';
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .proj-card-body {
    flex: 1;
    padding: 1.5rem 1.6rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
  }

  .proj-card-title {
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--global-text-color);
    line-height: 1.25;
    margin: 0;
    text-transform: lowercase;
  }

  .proj-card-desc {
    font-size: 0.8rem;
    color: var(--global-text-color-light, #888);
    line-height: 1.5;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .proj-card-github {
    margin-top: 0.5rem;
  }

  @media (max-width: 576px) {
    .proj-card { flex-direction: column; height: auto; }
    .proj-card-img { width: 100%; height: 160px; }
  }
</style>

<div class="card-item col">
  {%- if project.redirect -%}
  <a class="proj-card-link" href="{{ project.redirect }}">
  {%- else -%}
  <a class="proj-card-link" href="{{ project.url | relative_url }}">
  {%- endif -%}
    <div class="proj-card">
      <div class="proj-card-img">
        {%- if project.img -%}
        <img src="{{ project.img | relative_url }}" alt="{{ project.title }}" />
        {%- else -%}
          <div class="proj-card-img-placeholder"></div>
        {%- endif -%}
      </div>
      <div class="proj-card-body">
        <h3 class="proj-card-title">{{ project.title }}</h3>
        <p class="proj-card-desc">{{ project.description }}</p>
        {%- if project.github -%}
        <div class="proj-card-github">
          <a href="{{ project.github }}" onclick="event.stopPropagation()">
            <i class="fab fa-github" style="font-size: 1rem; opacity: 0.5;"></i>
          </a>
        </div>
        {%- endif -%}
      </div>
    </div>
  </a>
</div>
